[package]
name = "quarrel-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The desktop entrypoint lives in the library so the command handlers can be unit-tested
# without starting a window. `main.rs` is a four-line shim over `run()`.
name = "quarrel_app"
crate-type = ["lib"]

[[bin]]
name = "quarrel-desktop"
path = "src/main.rs"

[features]
# Tauri decides between "load the frontend from the dev server" and "load the frontend
# that is compiled into me" from this feature, and nothing else: `tauri-build` sets its
# `dev` cfg to exactly `not(custom-protocol)`.
#
# It is **on by default** here because the deliverable is an executable the user
# double-clicks. Without it a `cargo build --release` produces a binary that shows a blank
# window unless a Vite dev server happens to be running on port 5173 — which is a broken
# program that looks fine on the machine it was built on.
#
# For frontend hot-reload, build with `--no-default-features` and run `npm run dev` in
# `ui/` alongside it.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
quarrel-core = { workspace = true }
quarrel-chain = { workspace = true }
quarrel-store = { workspace = true }
quarrel-indexer = { workspace = true }
quarrel-backtest = { workspace = true }
quarrel-live = { workspace = true }
alloy-primitives = { workspace = true }
rusqlite = { workspace = true }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

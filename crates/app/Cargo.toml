[package]
name = "quarrel-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The desktop entrypoint lives in the library so the command handlers can be unit-tested
# without starting a window. `main.rs` is a four-line shim over `run()`.
name = "quarrel_app"
crate-type = ["lib"]

[[bin]]
name = "quarrel-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
quarrel-core = { workspace = true }
quarrel-chain = { workspace = true }
quarrel-store = { workspace = true }
quarrel-indexer = { workspace = true }
quarrel-backtest = { workspace = true }
quarrel-live = { workspace = true }
alloy-primitives = { workspace = true }
rusqlite = { workspace = true }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/chain",
    "crates/store",
    "crates/indexer",
    "crates/backtest",
    "crates/live",
    "crates/app",
    "crates/cli",
]

# scratch/bodkin is the MIT reference implementation, cloned for study.
# It is deliberately not a workspace member and is gitignored.
exclude = ["scratch"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/igorv/quarrel"
authors = ["quarrel contributors"]

[workspace.dependencies]
# --- internal -----------------------------------------------------------------
# Trust boundary (docs/ARCHITECTURE.md): nothing below `live` may depend on `live`.
quarrel-core = { path = "crates/core" }
quarrel-chain = { path = "crates/chain" }
quarrel-store = { path = "crates/store" }
quarrel-indexer = { path = "crates/indexer" }
quarrel-backtest = { path = "crates/backtest" }
quarrel-live = { path = "crates/live" }

# --- shared -------------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# U256 and Address. Pure types: no network, no I/O. `core` may depend on this.
alloy-primitives = { version = "1", features = ["serde"] }

# Pure, no I/O: `core` may depend on it for keyword rules.
regex = "1"

# Typed contract bindings and log decoding via the `sol!` macro. ABI only -- the
# JSON-RPC layer is ours, so the priority gate can be the single chokepoint every
# request passes through (spec sec.6.3) and record/replay can sit beneath it.
alloy-sol-types = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }

# SQLite only, deliberately (spec sec.4.1). `bundled` avoids depending on a system
# libsqlite3, which on Windows there is not one of.
rusqlite = { version = "0.37", features = ["bundled"] }
# Cross-platform advisory file locks, for the per-database writer lock of PLAN.md C3.
fs4 = "0.13"

# Desktop shell. Only `app` may depend on these: `cargo test --workspace` for phases 1-4
# must not need a GUI toolchain, and the cron/headless path in spec sec.10 must not either
# (PLAN.md D13).
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# The indexer replays hundreds of thousands of curve operations in tests.
# Unoptimised integer math makes phase 3 unbearable to iterate on.
[profile.dev.package."*"]
opt-level = 2
